services:
  visor:
    build: .
    container_name: visor
    # Run as the host user so the host CLI and the container share ownership of
    # the ./data volume (avoids PermissionError writing store.json).
    # Override to match your uid:gid, e.g. VISOR_USER=$(id -u):$(id -g)
    user: "${VISOR_USER:-1000:1000}"
    ports:
      - "8900:8900"
    volumes:
      - ./data:/data
    environment:
      - VISOR_DATA=/data
      - VISOR_PORT=8900
      # Optional bearer auth: set VISOR_TOKEN to gate /api/* and /media/*.
      # Leave unset for localhost/LAN open mode. The web UI reads it from
      # ?token=*** in the URL (EventSource can't set headers).
      - VISOR_TOKEN=${VISOR_TOKEN:-}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8900/api/health', timeout=2).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    # Keep the container alive while the server crash-loops at startup (e.g.
    # the data volume is root-owned and unreadable by the container user) so
    # `docker logs` shows the real traceback instead of an unexplained
    # connection reset.
    init: true
    restart: unless-stopped
