name: visor
version: 1.8.0
description: "Visor — push live visual blocks (todos, findings, tables, stats, charts, audio/video) to an infinite-canvas holographic webpage that updates in place via SSE. Turnkey: ships its own server (bare python, Docker opt-in) — no separate install."
author: "samundra"
requires_hermes: ">=0.21.5"
provides_tools:
  - visor_push
