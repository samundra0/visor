name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax checks
        run: |
          python3 -m py_compile server.py visor.py mcp/server.py scripts/smoke.py
          # the client is one big <script> blob — a single syntax error kills
          # the whole page, so lint it here instead of by hand
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('index.html', 'utf8');
            const m = html.match(/<script>([\s\S]*)<\/script>/);
            if (!m) { console.error('no <script> found in index.html'); process.exit(1); }
            new Function(m[1]);
            console.log('index.html script: syntax OK (' + m[1].split('\n').length + ' lines)');
          "

      - name: Build container
        run: docker compose build -q

      - name: Start
        run: |
          # match the container user to this machine's user so the ./data
          # bind-mount (created by git checkout) is writable by the server
          export VISOR_USER="$(id -u):$(id -g)"
          docker compose up -d
          for i in $(seq 1 30); do
            curl -sf http://localhost:8900/api/boards >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8900/api/boards

      - name: Smoke test
        run: python3 scripts/smoke.py

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans || true
